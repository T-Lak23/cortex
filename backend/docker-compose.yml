services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    env_file:
      - gateway/.env
    ports:
      - "8000:8000"
    depends_on:
      - auth
      - chat
      - agent
      - billing
      - redis

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file:
      - services/auth/.env
    ports:
      - "8001:8001"
    depends_on:
      - redis

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    env_file:
      - services/chat/.env
    ports:
      - "8002:8002"
    depends_on:
      - redis

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    env_file:
      - services/agent/.env
    ports:
      - "8003:8003"
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    env_file:
      - services/billing/.env
    ports:
      - "8004:8004"
    depends_on:
      - redis
